name: HalfMarathonComeback
options:
  bundleIdPrefix: com.ryanhayden
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Comeback
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    CODE_SIGN_STYLE: Automatic
targets:
  HalfMarathonComeback:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanhayden.halfmarathoncomeback
  HalfMarathonComebackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HalfMarathonComeback
schemes:
  HalfMarathonComeback:
    build:
      targets:
        HalfMarathonComeback: all
    test:
      targets: [HalfMarathonComebackTests]
