name: HalfMarathonComeback
options:
  bundleIdPrefix: com.ryanhayden
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.2'
    CURRENT_PROJECT_VERSION: '6'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Comeback
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: R53X844C48
targets:
  HalfMarathonComeback:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio, location]
        NSLocationWhenInUseUsageDescription: Comeback uses precise GPS during your run to record distance, pace, mile splits, and your route, including while your screen is locked.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanhayden.halfmarathoncomeback
        TARGETED_DEVICE_FAMILY: '1'
  HalfMarathonComebackTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: HalfMarathonComeback
schemes:
  HalfMarathonComeback:
    build:
      targets:
        HalfMarathonComeback: all
    test:
      targets: [HalfMarathonComebackTests]
